[project]
name = "saki"
version = "2.2.0"
description = "智能技能锻造者 - 为 AI 编程助手注入上下文感知的专业技能"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "questionary>=2.0.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.8"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.ty.environment]
python-version = "3.12"
